                                <span>
                                    Serveur: http://localhost:8000
                                    {nemetonStatus?.available && <span className="ml-2 text-purple-400">• Nemeton ✓</span>}
                                    {aceStatus?.available && <span className="ml-2 text-blue-400">• ACE ✓</span>}
                                </span>
                            </div>
                        </div>

                        {/* Modal Forensique Détaillée */}
                        {showInteractionModal && selectedInteraction && (
                            <div
                                className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4"
                                onClick={() => setShowInteractionModal(false)}
                            >
                                <div
                                    className="bg-slate-800 rounded-lg w-full max-w-6xl max-h-[90vh] overflow-hidden flex flex-col"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    {/* Header */}
                                    <div className="bg-slate-900 p-4 border-b border-slate-700 flex justify-between items-center">
                                        <div>
                                            <h2 className="text-xl font-bold text-white">🔍 Détail Forensique</h2>
                                            <p className="text-xs text-slate-400 mt-1">
                                                {selectedInteraction.interaction_id} • {new Date(selectedInteraction.timestamp * 1000).toLocaleString('fr-FR')}
                                            </p>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {/* Boutons Export */}
                                            <a
                                                href={`http://localhost:8000/analytics/export/${selectedInteraction.interaction_id}?format=json`}
                                                download
                                                className="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs text-white"
                                            >
                                                📥 JSON
                                            </a>
                                            <a
                                                href={`http://localhost:8000/analytics/export/${selectedInteraction.interaction_id}?format=md`}
                                                download
                                                className="px-3 py-1 bg-green-600 hover:bg-green-700 rounded text-xs text-white"
                                            >
                                                📄 Markdown
                                            </a>
                                            <button
                                                onClick={() => setShowInteractionModal(false)}
                                                className="text-slate-400 hover:text-white text-2xl ml-2"
                                            >
                                                ✕
                                            </button>
                                        </div>
                                    </div>

                                    {/* Tabs Navigation */}
                                    <div className="bg-slate-900 px-4 border-b border-slate-700 flex gap-1 overflow-x-auto">
                                        {[
                                            {id: 'input', label: 'Input', icon: '📝'},
                                            {id: 'enrichment', label: 'Enrichment', icon: '🔄'},
                                            {id: 'payload', label: 'Payload Ollama', icon: '📡'},
                                            {id: 'response', label: 'Response', icon: '💬'},
                                            {id: 'nemeton', label: 'Nemeton', icon: '🌀'},
                                            {id: 'ace', label: 'ACE', icon: '🎯'},
                                            {id: 'performance', label: 'Performance', icon: '⚡'}
                                        ].map(tab => (
                                            <button
                                                key={tab.id}
                                                onClick={() => setForensicTab(tab.id)}
                                                className={`px-4 py-3 text-sm font-medium transition-colors border-b-2 whitespace-nowrap ${
                                                    forensicTab === tab.id
                                                        ? 'text-blue-400 border-blue-400'
                                                        : 'text-slate-400 border-transparent hover:text-white'
                                                }`}
                                            >
                                                {tab.icon} {tab.label}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Tab Content */}
                                    <div className="flex-1 overflow-y-auto p-6">
                                        {/* Tab: INPUT */}
                                        {forensicTab === 'input' && (
                                            <div className="space-y-4">
                                                <div>
                                                    <h3 className="text-sm font-semibold text-slate-300 mb-2">User Input (Brut)</h3>
                                                    <pre className="bg-slate-900 p-4 rounded text-sm text-white overflow-x-auto">
                                                        {selectedInteraction.user_input?.text || 'N/A'}
                                                    </pre>
                                                </div>

                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <h3 className="text-sm font-semibold text-slate-300 mb-2">Paramètres Lyra</h3>
                                                        <div className="bg-slate-900 p-4 rounded space-y-2 text-sm">
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">ρ (rho):</span>
                                                                <span className="text-white font-mono">{selectedInteraction.user_input?.params?.rho?.toFixed(3) || 'N/A'}</span>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">δr (delta_r):</span>
                                                                <span className="text-white font-mono">{selectedInteraction.user_input?.params?.delta_r?.toFixed(3) || 'N/A'}</span>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">τc (tau_c):</span>
                                                                <span className="text-white font-mono">{selectedInteraction.user_input?.params?.tau_c?.toFixed(3) || 'N/A'}</span>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">κ (kappa):</span>
                                                                <span className="text-white font-mono">{selectedInteraction.user_input?.params?.kappa?.toFixed(3) || 'N/A'}</span>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <h3 className="text-sm font-semibold text-slate-300 mb-2">Cards & Options</h3>
                                                        <div className="bg-slate-900 p-4 rounded text-sm">
                                                            <div className="mb-2">
                                                                <span className="text-slate-400">Cards: </span>
                                                                <span className="text-white">{selectedInteraction.user_input?.cards?.length || 0}</span>
                                                            </div>
                                                            <div>
                                                                <span className="text-slate-400">Graph Injection: </span>
                                                                <span className={selectedInteraction.user_input?.enable_graph_injection ? 'text-green-400' : 'text-red-400'}>
                                                                    {selectedInteraction.user_input?.enable_graph_injection ? '✓ Enabled' : '✗ Disabled'}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Tab: ENRICHMENT */}
                                        {forensicTab === 'enrichment' && (
                                            <div className="space-y-4">
                                                <div>
                                                    <h3 className="text-sm font-semibold text-slate-300 mb-2">Memory Packets (Echo)</h3>
                                                    <pre className="bg-slate-900 p-4 rounded text-xs text-white overflow-x-auto max-h-40 overflow-y-auto">
                                                        {JSON.stringify(selectedInteraction.enrichment?.memory_packets || [], null, 2)}
                                                    </pre>
                                                </div>

                                                <div>
                                                    <h3 className="text-sm font-semibold text-slate-300 mb-2">Graph Context</h3>
                                                    <div className="bg-slate-900 p-4 rounded text-sm space-y-2">
                                                        <div>
                                                            <span className="text-slate-400">Concepts: </span>
                                                            <span className="text-white">{selectedInteraction.enrichment?.graph_context?.concepts?.join(', ') || 'N/A'}</span>
                                                        </div>
                                                        <div>
                                                            <span className="text-slate-400">Contextual Weight: </span>
                                                            <span className="text-white font-mono">{selectedInteraction.enrichment?.graph_context?.contextual_weight?.toFixed(4) || 'N/A'}</span>
                                                        </div>
                                                        <div>
                                                            <span className="text-slate-400">Associations: </span>
                                                            <span className="text-white">{selectedInteraction.enrichment?.graph_context?.associations?.length || 0}</span>
                                                        </div>
                                                    </div>
                                                    <pre className="bg-slate-900 p-4 rounded text-xs text-white overflow-x-auto max-h-40 overflow-y-auto mt-2">
                                                        {JSON.stringify(selectedInteraction.enrichment?.graph_context || {}, null, 2)}
                                                    </pre>
                                                </div>

                                                <div>
                                                    <h3 className="text-sm font-semibold text-slate-300 mb-2">Transformation Prompt</h3>
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <div>
                                                            <h4 className="text-xs text-slate-400 mb-1">AVANT (Original)</h4>
                                                            <pre className="bg-slate-900 p-3 rounded text-xs text-white overflow-x-auto max-h-60 overflow-y-auto">
                                                                {selectedInteraction.enrichment?.prompt_before || 'N/A'}
                                                            </pre>
                                                        </div>
                                                        <div>
                                                            <h4 className="text-xs text-slate-400 mb-1">APRÈS (Enrichi)</h4>
                                                            <pre className="bg-slate-900 p-3 rounded text-xs text-green-400 overflow-x-auto max-h-60 overflow-y-auto">
                                                                {selectedInteraction.enrichment?.prompt_after || 'N/A'}
                                                            </pre>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Tab: PAYLOAD OLLAMA */}
                                        {forensicTab === 'payload' && (
                                            <div className="space-y-4">
                                                <div className="bg-blue-900 border border-blue-700 p-3 rounded">
                                                    <p className="text-sm text-blue-200">
                                                        <strong>Ce payload est exactement ce qui a été envoyé à Ollama.</strong> Vous pouvez le copier pour reproduire l'inférence exacte.
                                                    </p>
                                                </div>

                                                <div>
                                                    <div className="flex justify-between items-center mb-2">
                                                        <h3 className="text-sm font-semibold text-slate-300">Payload JSON Complet</h3>
                                                        <button
                                                            onClick={() => {
                                                                navigator.clipboard.writeText(JSON.stringify(selectedInteraction.llm_response?.ollama_payload || {}, null, 2));
                                                                alert('Payload copié dans le presse-papier !');
                                                            }}
                                                            className="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs text-white"
                                                        >
                                                            📋 Copier JSON
                                                        </button>
                                                    </div>
                                                    <pre className="bg-slate-900 p-4 rounded text-xs text-white overflow-x-auto max-h-96 overflow-y-auto">
                                                        {JSON.stringify(selectedInteraction.llm_response?.ollama_payload || {}, null, 2)}
                                                    </pre>
                                                </div>

                                                <div>
                                                    <h3 className="text-sm font-semibold text-slate-300 mb-2">Messages</h3>
                                                    <div className="space-y-3">
                                                        <div className="bg-blue-900 border-l-4 border-blue-500 p-4 rounded">
                                                            <h4 className="text-xs font-semibold text-blue-200 mb-2">[SYSTEM]</h4>
                                                            <pre className="text-xs text-white whitespace-pre-wrap">
                                                                {selectedInteraction.llm_response?.ollama_payload?.messages?.[0]?.content || 'N/A'}
                                                            </pre>
                                                        </div>
                                                        <div className="bg-purple-900 border-l-4 border-purple-500 p-4 rounded">
                                                            <h4 className="text-xs font-semibold text-purple-200 mb-2">[USER] (avec enrichment Lyra)</h4>
                                                            <pre className="text-xs text-white whitespace-pre-wrap max-h-60 overflow-y-auto">
                                                                {selectedInteraction.llm_response?.ollama_payload?.messages?.[1]?.content || 'N/A'}
                                                            </pre>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div>
                                                    <h3 className="text-sm font-semibold text-slate-300 mb-2">Options Ollama</h3>
                                                    <pre className="bg-slate-900 p-4 rounded text-xs text-white overflow-x-auto">
                                                        {JSON.stringify(selectedInteraction.llm_response?.ollama_payload?.options || {}, null, 2)}
                                                    </pre>
                                                </div>
                                            </div>
                                        )}

                                        {/* Tab: RESPONSE */}
                                        {forensicTab === 'response' && (
                                            <div className="space-y-4">
                                                <div>
                                                    <h3 className="text-sm font-semibold text-slate-300 mb-2">Réponse LLM (Brute)</h3>
                                                    <pre className="bg-slate-900 p-4 rounded text-sm text-white overflow-x-auto max-h-96 overflow-y-auto whitespace-pre-wrap">
                                                        {selectedInteraction.llm_response?.text || 'N/A'}
                                                    </pre>
                                                </div>

                                                <div className="grid grid-cols-3 gap-4">
                                                    <div className="bg-slate-900 p-4 rounded">
                                                        <div className="text-xs text-slate-400">Modèle</div>
                                                        <div className="text-white font-mono mt-1">{selectedInteraction.llm_response?.model || 'N/A'}</div>
                                                    </div>
                                                    <div className="bg-slate-900 p-4 rounded">
                                                        <div className="text-xs text-slate-400">Temps d'exécution</div>
                                                        <div className="text-white font-mono mt-1">{selectedInteraction.llm_response?.execution_time?.toFixed(2) || 'N/A'} s</div>
                                                    </div>
                                                    <div className="bg-slate-900 p-4 rounded">
                                                        <div className="text-xs text-slate-400">Tokens (approx)</div>
                                                        <div className="text-white font-mono mt-1">{selectedInteraction.llm_response?.tokens_generated || 'N/A'}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Tab: NEMETON */}
                                        {forensicTab === 'nemeton' && (
                                            <div className="space-y-4">
                                                <div>
                                                    <h3 className="text-sm font-semibold text-slate-300 mb-2">État Nemeton</h3>
                                                    <div className="grid grid-cols-2 gap-4">
                                                        <div>
                                                            <h4 className="text-xs text-slate-400 mb-2">AVANT interaction</h4>
                                                            <pre className="bg-slate-900 p-4 rounded text-xs text-white overflow-x-auto">
                                                                {JSON.stringify(selectedInteraction.nemeton_state?.before || {}, null, 2)}
                                                            </pre>
                                                        </div>
                                                        <div>
                                                            <h4 className="text-xs text-slate-400 mb-2">APRÈS interaction</h4>
                                                            <pre className="bg-slate-900 p-4 rounded text-xs text-green-400 overflow-x-auto">
                                                                {JSON.stringify(selectedInteraction.nemeton_state?.after || {}, null, 2)}
                                                            </pre>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="bg-purple-900 border border-purple-700 p-4 rounded">
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-sm font-semibold text-purple-200">Phase λ activée:</span>
                                                        <span className={`text-lg font-bold ${selectedInteraction.nemeton_state?.lambda_activated ? 'text-purple-400' : 'text-slate-500'}`}>
                                                            {selectedInteraction.nemeton_state?.lambda_activated ? '✓ OUI' : '✗ NON'}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Tab: ACE */}
                                        {forensicTab === 'ace' && (
                                            <div className="space-y-4">
                                                <div>
                                                    <h3 className="text-sm font-semibold text-slate-300 mb-2">Pipeline ACE Complet</h3>
                                                    <pre className="bg-slate-900 p-4 rounded text-xs text-white overflow-x-auto max-h-96 overflow-y-auto">
                                                        {JSON.stringify(selectedInteraction.ace_pipeline || {}, null, 2)}
                                                    </pre>
                                                </div>

                                                {selectedInteraction.ace_pipeline && (
                                                    <div className="grid grid-cols-3 gap-4">
                                                        <div className="bg-slate-900 p-4 rounded">
                                                            <div className="text-xs text-slate-400">Generate</div>
                                                            <div className="text-2xl text-blue-400 font-bold mt-1">
                                                                {selectedInteraction.ace_pipeline.generate?.bullets_generated || 0}
                                                            </div>
                                                            <div className="text-xs text-slate-400 mt-1">bullets générés</div>
                                                        </div>
                                                        <div className="bg-slate-900 p-4 rounded">
                                                            <div className="text-xs text-slate-400">Reflect</div>
                                                            <div className="text-2xl text-green-400 font-bold mt-1">
                                                                {selectedInteraction.ace_pipeline.reflect?.lessons_extracted || 0}
                                                            </div>
                                                            <div className="text-xs text-slate-400 mt-1">lessons extraites</div>
                                                        </div>
                                                        <div className="bg-slate-900 p-4 rounded">
                                                            <div className="text-xs text-slate-400">Curate</div>
                                                            <div className="text-2xl text-purple-400 font-bold mt-1">
                                                                {selectedInteraction.ace_pipeline.curate?.bullets_ingested || 0}
                                                            </div>
                                                            <div className="text-xs text-slate-400 mt-1">bullets ingérés</div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Tab: PERFORMANCE */}
                                        {forensicTab === 'performance' && (
                                            <div className="space-y-4">
                                                <div className="bg-slate-900 p-4 rounded">
                                                    <div className="text-sm text-slate-400">Temps Total</div>
                                                    <div className="text-3xl text-white font-bold mt-1">
                                                        {selectedInteraction.performance?.total_time?.toFixed(3) || 'N/A'} s
                                                    </div>
                                                </div>

                                                <div>
                                                    <h3 className="text-sm font-semibold text-slate-300 mb-2">Breakdown par Opération</h3>
                                                    <div className="bg-slate-900 rounded overflow-hidden">
                                                        <table className="w-full text-sm">
                                                            <thead className="bg-slate-800">
                                                                <tr>
                                                                    <th className="text-left p-3 text-slate-400">Opération</th>
                                                                    <th className="text-right p-3 text-slate-400">Durée (s)</th>
                                                                    <th className="text-right p-3 text-slate-400">% Total</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody className="text-white">
                                                                {selectedInteraction.performance?.breakdown && Object.entries(selectedInteraction.performance.breakdown).map(([op, duration]) => {
                                                                    const total = selectedInteraction.performance.total_time || 1;
                                                                    const percentage = ((duration / total) * 100).toFixed(1);
                                                                    return (
                                                                        <tr key={op} className="border-t border-slate-800">
                                                                            <td className="p-3 font-mono text-xs">{op}</td>
                                                                            <td className="p-3 text-right font-mono">{duration?.toFixed(3)}</td>
                                                                            <td className="p-3 text-right">
                                                                                <div className="flex items-center justify-end gap-2">
                                                                                    <div className="w-20 bg-slate-700 rounded-full h-2">
                                                                                        <div
                                                                                            className="bg-blue-500 h-2 rounded-full"
                                                                                            style={{width: `${Math.min(percentage, 100)}%`}}
                                                                                        ></div>
                                                                                    </div>
                                                                                    <span className="w-12 text-right">{percentage}%</span>
                                                                                </div>
                                                                            </td>
                                                                        </tr>
                                                                    );
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        ReactDOM.render(<LyraAdvancedInterface />, document.getElementById('root'));
    </script>
</body>
</html>
