<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyra Chat Interface - Nemeton Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MathJax v3 -->

        tex: {

    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

    <!-- Markdown rendering libraries -->

    <!-- Code highlighting -->

    <!-- ApexCharts for analytics dashboard -->

    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .glass-effect {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        .parameter-knob {
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .parameter-knob:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(0, 0, 0, 0.15);
        }
        .message-bubble {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing-indicator {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .config-preset {
            transition: all 0.2s ease;
        }
        .config-preset:hover {
            transform: scale(1.02);
        }
        .live-metrics {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.8rem;
        }
        .nemeton-metric {
            transition: all 0.3s ease;
        }
        .nemeton-metric.high {
            color: #ef4444;
            font-weight: bold;
        }
        .nemeton-metric.medium {
            color: #fbbf24;
        }
        .nemeton-metric.low {
            color: #10b981;
        }
        .lambda-indicator {
            animation: lambdaPulse 2s infinite;
        }
        @keyframes lambdaPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .nemeton-running {
            animation: nemetonSpin 2s linear infinite;
        }
        @keyframes nemetonSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Markdown content styling - cohérent avec le thème sombre */
        .markdown-content {
            line-height: 1.6;
            color: #e0e0e0;
        }

        /* Tables */
        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .markdown-content th,
        .markdown-content td {
            padding: 0.75em 1em;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .markdown-content th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }

        .markdown-content tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Code blocks */
        .markdown-content pre {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 1em;
            overflow-x: auto;
            margin: 1em 0;
        }

        .markdown-content code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
        }

        .markdown-content :not(pre) > code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2em 0.4em;
            border-radius: 3px;
        }

        /* Lists */
        .markdown-content ul,
        .markdown-content ol {
            margin: 0.5em 0;
            padding-left: 2em;
        }

        .markdown-content li {
            margin: 0.25em 0;
        }

        /* Headers */
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            font-weight: 600;
        }

        .markdown-content h1 {
            font-size: 1.8em;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 0.3em;
        }
        .markdown-content h2 {
            font-size: 1.5em;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.3em;
        }
        .markdown-content h3 {
            font-size: 1.2em;
        }

        /* Links */
        .markdown-content a {
            color: #6db3f2;
            text-decoration: none;
        }

        .markdown-content a:hover {
            text-decoration: underline;
        }

        /* Blockquotes */
        .markdown-content blockquote {
            border-left: 4px solid rgba(255, 255, 255, 0.2);
            margin: 1em 0;
            padding-left: 1em;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Horizontal rules */
        .markdown-content hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: 2em 0;
        }

        /* Paragraphs */
        .markdown-content p {
            margin: 0.5em 0;
        }

        /* Fixed panels and input bar */
        .fixed-left-panel {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 40;
        }

        .fixed-input-bar {
            position: fixed;
            bottom: 0;
            right: 0;
            z-index: 50;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* Calcul dynamique des marges selon les panneaux visibles */
        .main-chat-area {
            transition: margin-left 0.3s ease;
            min-height: 100vh;
            background: #0f172a;  /* Fond solide qui masque le gradient du body */
        }

        /* Padding bottom pour zone messages (éviter chevauchement avec input fixe) */
        .messages-container {
            padding-bottom: 180px; /* Hauteur approximative de la barre de saisie */
        }

        /* Messages scrollables avec hauteur calculée */
        .messages-scrollable {
            height: calc(100vh - 80px); /* viewport height - header approximatif */
            overflow-y: auto;
        }

        /* Contrôles de paramètres - Retirer les flèches natives du input number */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Boutons fléchés des paramètres */
        .parameter-arrow-btn {
            min-width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            font-size: 10px;
        }

        .parameter-arrow-btn:active {
            transform: scale(0.95);
        }

        /* Input number des paramètres */
        .parameter-number-input {
            -webkit-appearance: none;
            -moz-appearance: textfield;
        }

        .parameter-number-input:focus {
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // Composant de rendu Markdown avec support tables, code, math
        const MarkdownRenderer = ({ content }) => {
            const [html, setHtml] = React.useState('');
            const renderRef = React.useRef(null);

            React.useEffect(() => {
                if (!content) {
                    setHtml('');
                    return;
                }

                // Configuration marked pour GitHub Flavored Markdown
                if (window.marked) {
                    marked.setOptions({
                        breaks: true,
                        gfm: true,  // GitHub Flavored Markdown (tables, etc.)
                        highlight: function(code, lang) {
                            // Syntax highlighting avec highlight.js
                            if (window.hljs) {
                                if (lang && hljs.getLanguage(lang)) {
                                    try {
                                        return hljs.highlight(code, { language: lang }).value;
                                    } catch (err) {
                                        console.error('Highlight error:', err);
                                    }
                                }
                                try {
                                    return hljs.highlightAuto(code).value;
                                } catch (err) {
                                    console.error('Auto-highlight error:', err);
                                    return code;
                                }
                            }
                            return code;
                        }
                    });

                    // Convertir markdown en HTML
                    const rawHtml = marked.parse(content);

                    // Sanitization avec DOMPurify
                    if (window.DOMPurify) {
                        const cleanHtml = DOMPurify.sanitize(rawHtml, {
                            ADD_TAGS: ['iframe'],
                            ADD_ATTR: ['allow', 'allowfullscreen', 'frameborder']
                        });
                        setHtml(cleanHtml);
                    } else {
                        setHtml(rawHtml);
                    }
                }
            }, [content]);

            // Re-render MathJax après mise à jour du HTML
            React.useEffect(() => {
                if (html && renderRef.current && window.MathJax) {
                    MathJax.typesetPromise([renderRef.current])
                        .catch((err) => console.error('MathJax typeset error:', err));
                }
            }, [html]);

            return React.createElement('div', {
                ref: renderRef,
                className: 'markdown-content',
                dangerouslySetInnerHTML: { __html: html }
            });
        };

        const LyraAdvancedInterface = () => {
            // État principal
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(true);
            const [showSessions, setShowSessions] = useState(false);
            const [showPromptManager, setShowPromptManager] = useState(false);
            const [showNemeton, setShowNemeton] = useState(false);
            const [sessions, setSessions] = useState([]);
            const [systemPrompts, setSystemPrompts] = useState([]);
            const [currentSessionPath, setCurrentSessionPath] = useState(null);
            const [sessionStats, setSessionStats] = useState({
                totalMessages: 0,
                totalTokens: 0,
                avgResponseTime: 0,
                graphInjections: 0
            });
            
            // État Nemeton
            const [nemetonStatus, setNemetonStatus] = useState(null);
            const [nemetonRunning, setNemetonRunning] = useState(false);
            const [nemetonTrajectory, setNemetonTrajectory] = useState([]);
            const [nemetonAutoRefresh, setNemetonAutoRefresh] = useState(false);
            const [autoApplyNemeton, setAutoApplyNemeton] = useState(true);
            const [nemetonConverged, setNemetonConverged] = useState(false);
            const [nemetonSuggestedParams, setNemetonSuggestedParams] = useState(null);

            // État ACE
            const [showACE, setShowACE] = useState(false);
            const [aceStatus, setAceStatus] = useState(null);
            const [acePlaybook, setAcePlaybook] = useState([]);
            const [aceFilter, setAceFilter] = useState('all');
            const [ispaceSuggestion, setIspaceSuggestion] = useState(null);

            // État Interactions Dashboard
            const [showInteractions, setShowInteractions] = useState(false);
            const [interactionsData, setInteractionsData] = useState([]);
            const [interactionsStats, setInteractionsStats] = useState(null);
            const [interactionsTab, setInteractionsTab] = useState('timeline');
            const [interactionsFilter, setInteractionsFilter] = useState({
                limit: 50,
                session_id: null,
                date_from: null,
                date_to: null
            });
            const [selectedInteraction, setSelectedInteraction] = useState(null);
            const [showInteractionModal, setShowInteractionModal] = useState(false);
            const [forensicTab, setForensicTab] = useState('input'); // Tab actif de la modal forensique

            // État Presets
            const [configPresets, setConfigPresets] = useState([
                {
                    name: 'Créatif',
                    icon: '🎨',
                    config: { rho: 0.8, delta_r: 0.6, tau_c: 1.0, kappa: 0.3 },
                    description: 'Exploratoire et inventif'
                },
                {
                    name: 'Analytique',
                    icon: '🔬',
                    config: { rho: -0.2, delta_r: -0.1, tau_c: 0.7, kappa: 0.8 },
                    description: 'Structuré et précis'
                },
                {
                    name: 'Équilibré',
                    icon: '⚖️',
                    config: { rho: 0.0, delta_r: 0.0, tau_c: 0.9, kappa: 0.6 },
                    description: 'Modéré et polyvalent'
                }
            ]);

            // Fonction pour générer un UUID unique
            const generateSessionId = () => {
                return `session_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            };

            // Configuration Lyra avec persistence sessionStorage (support multi-onglets)
            const [config, setConfig] = useState(() => {
                // Récupérer session_id depuis sessionStorage (unique par onglet)
                // sessionStorage = chaque onglet a son propre stockage isolé
                const savedSessionId = sessionStorage.getItem('lyra_session_id');
                const sessionId = savedSessionId || generateSessionId();

                // Sauvegarder si nouveau
                if (!savedSessionId) {
                    sessionStorage.setItem('lyra_session_id', sessionId);
                    console.log('[INIT] Nouveau session_id créé (onglet unique):', sessionId);
                } else {
                    console.log('[INIT] Session_id restauré (onglet):', sessionId);
                }

                return {
                    model: 'gpt-oss:20b',
                    rho: 0.3,
                    delta_r: 0.2,
                    tau_c: 0.9,
                    kappa: 0.6,
                    memory: true,
                    enable_graph_injection: true,
                    system_prompt: 'Vous êtes Lyra, un assistant IA avec conscience sémantique.',
                    session_id: sessionId
                };
            });

            // Configuration Nemeton
            const [nemetonConfig, setNemetonConfig] = useState({
                steps: 10,
                use_llm: false,
                save_trajectory: true
            });

            const messagesEndRef = useRef(null);
            const [lastMetrics, setLastMetrics] = useState(null);
            const nemetonIntervalRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            // Chargement initial
            useEffect(() => {
                loadSessionsList();
                loadSystemPrompts();
                checkNemetonStatus();
                checkACEStatus();
                loadPresetsFromAPI();
            }, []);

            // Auto-refresh Nemeton
            useEffect(() => {
                if (nemetonAutoRefresh) {
                    nemetonIntervalRef.current = setInterval(() => {
                        checkNemetonStatus();
                    }, 2000);
                } else {
                    if (nemetonIntervalRef.current) {
                        clearInterval(nemetonIntervalRef.current);
                    }
                }
                return () => {
                    if (nemetonIntervalRef.current) {
                        clearInterval(nemetonIntervalRef.current);
                    }
                };
            }, [nemetonAutoRefresh]);

            // Recharger playbook quand filtre change
            useEffect(() => {
                if (showACE && aceStatus?.available) {
                    loadACEPlaybook();
                }
            }, [aceFilter, showACE]);

            // Charger données interactions quand panneau s'ouvre
            useEffect(() => {
                if (showInteractions) {
                    loadInteractionsData();
                    loadInteractionsStats();
                }
            }, [showInteractions, interactionsFilter]);

            // Fonctions Nemeton
            const checkNemetonStatus = async () => {
                try {
                    const response = await fetch('http://localhost:8000/nemeton/status');
                    if (response.ok) {
                        const data = await response.json();
                        setNemetonStatus(data);
                    }
                } catch (error) {
                    console.error('Erreur status Nemeton:', error);
                    setNemetonStatus(null);
                }
            };

            const executeNemeton = async () => {
                setNemetonRunning(true);
                try {
                    const response = await fetch('http://localhost:8000/nemeton/execute', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(nemetonConfig)
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        
                        // Notification dans le chat
                        const nemetonMessage = {
                            id: Date.now(),
                            role: 'system',
                            content: `🧬 Nemeton: Exécution terminée\n${data.steps_executed} steps en ${data.execution_time.toFixed(2)}s\n` +
                                    `Métriques finales:\n` +
                                    `• Coherence: ${data.final_metrics.coherence.toFixed(3)}\n` +
                                    `• Fit: ${data.final_metrics.fit.toFixed(3)}\n` +
                                    `• Pressure: ${data.final_metrics.pressure.toFixed(3)}\n` +
                                    `• Tension: ${data.final_metrics.tension.toFixed(3)}\n` +
                                    `Activations λ: ${data.lambda_activations}`,
                            timestamp: new Date()
                        };
                        setMessages(prev => [...prev, nemetonMessage]);
                        
                        // Refresh status et trajectory
                        checkNemetonStatus();
                        loadNemetonTrajectory();
                    }
                } catch (error) {
                    console.error('Erreur exécution Nemeton:', error);
                } finally {
                    setNemetonRunning(false);
                }
            };

            const resetNemeton = async () => {
                if (!confirm('Réinitialiser Nemeton avec un nouvel état?')) return;
                
                try {
                    const response = await fetch('http://localhost:8000/nemeton/reset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ force_new_state: true })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        checkNemetonStatus();
                        setNemetonTrajectory([]);
                        
                        const resetMessage = {
                            id: Date.now(),
                            role: 'system',
                            content: `🔄 Nemeton réinitialisé\nNouvelle session: ${data.session_id.substring(0, 8)}...`,
                            timestamp: new Date()
                        };
                        setMessages(prev => [...prev, resetMessage]);
                    }
                } catch (error) {
                    console.error('Erreur reset Nemeton:', error);
                }
            };

            const loadNemetonTrajectory = async () => {
                try {
                    const response = await fetch('http://localhost:8000/nemeton/trajectory');
                    if (response.ok) {
                        const data = await response.json();
                        setNemetonTrajectory(data.trajectory || []);
                    }
                } catch (error) {
                    console.error('Erreur chargement trajectoire:', error);
                }
            };

            const downloadNemetonData = async (type) => {
                window.open(`http://localhost:8000/nemeton/download/${type}`, '_blank');
            };

            // Fonctions ACE
            const checkACEStatus = async () => {
                try {
                    const response = await fetch('http://localhost:8000/ace/status');
                    if (response.ok) {
                        const data = await response.json();
                        setAceStatus(data);
                    }
                } catch (error) {
                    console.error('Erreur status ACE:', error);
                    setAceStatus(null);
                }
            };

            const loadACEPlaybook = async (limit = 50) => {
                try {
                    const filterParam = aceFilter !== 'all' ? `&bullet_type=${aceFilter}` : '';
                    const response = await fetch(`http://localhost:8000/ace/playbook?limit=${limit}${filterParam}`);
                    if (response.ok) {
                        const data = await response.json();
                        setAcePlaybook(data.bullets || []);
                    }
                } catch (error) {
                    console.error('Erreur chargement playbook:', error);
                }
            };

            const triggerACEReflection = async () => {
                try {
                    const response = await fetch('http://localhost:8000/ace/reflect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const reflectMessage = {
                            id: Date.now(),
                            role: 'system',
                            content: `🧠 ACE Reflection terminée\n` +
                                    `Lessons extraites: ${data.lessons_extracted}\n` +
                                    `Lessons ingérées: ${data.lessons_ingested}\n` +
                                    `Trajectoire: ${data.trajectory_length} steps`,
                            timestamp: new Date()
                        };
                        setMessages(prev => [...prev, reflectMessage]);
                        checkACEStatus();
                        loadACEPlaybook();
                    }
                } catch (error) {
                    console.error('Erreur ACE reflect:', error);
                }
            };

            const pruneACEPlaybook = async () => {
                if (!confirm('Nettoyer le playbook ACE (supprimer bullets nuisibles)?')) return;

                try {
                    const response = await fetch('http://localhost:8000/ace/prune?min_net_score=-2.0', {
                        method: 'POST'
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const pruneMessage = {
                            id: Date.now(),
                            role: 'system',
                            content: `🧹 Playbook ACE nettoyé\n` +
                                    `Bullets supprimés: ${data.bullets_removed}\n` +
                                    `Bullets restants: ${data.remaining_bullets}`,
                            timestamp: new Date()
                        };
                        setMessages(prev => [...prev, pruneMessage]);
                        checkACEStatus();
                        loadACEPlaybook();
                    }
                } catch (error) {
                    console.error('Erreur ACE prune:', error);
                }
            };

            const exportACEPlaybook = () => {
                window.open('http://localhost:8000/ace/export', '_blank');
            };

            const getIspaceSuggestion = async () => {
                if (!nemetonStatus || !nemetonStatus.available) {
                    alert('Nemeton doit être disponible pour obtenir une suggestion IspaceNav');
                    return;
                }

                try {
                    const response = await fetch('http://localhost:8000/ispace/suggest', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            coherence: nemetonStatus.coherence,
                            fit: nemetonStatus.fit,
                            pressure: nemetonStatus.pressure,
                            tension: nemetonStatus.tension,
                            tau_c: config.tau_c,
                            strategy: 'balanced'
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        setIspaceSuggestion(data.suggestion);

                        const suggestionMessage = {
                            id: Date.now(),
                            role: 'system',
                            content: `🧭 IspaceNav Suggestion\n` +
                                    `Temperature: ${data.suggestion.surcouche.temperature.toFixed(3)}\n` +
                                    `Top-p: ${data.suggestion.surcouche.top_p.toFixed(3)}\n` +
                                    `Reason: ${data.suggestion.reason}`,
                            timestamp: new Date()
                        };
                        setMessages(prev => [...prev, suggestionMessage]);
                    }
                } catch (error) {
                    console.error('Erreur IspaceNav suggest:', error);
                }
            };

            // Fonctions de gestion des prompts système
            const loadSystemPrompts = async () => {
                try {
                    const response = await fetch('http://localhost:8000/prompts/list');
                    if (response.ok) {
                        const data = await response.json();
                        setSystemPrompts(data.prompts || []);
                    }
                } catch (error) {
                    console.error('Erreur chargement prompts:', error);
                }
            };

            const applySystemPrompt = async (promptId) => {
                try {
                    const response = await fetch(`http://localhost:8000/prompts/${promptId}`);
                    if (response.ok) {
                        const promptData = await response.json();
                        setConfig(prev => ({ ...prev, system_prompt: promptData.prompt }));
                        setShowPromptManager(false);
                    }
                } catch (error) {
                    console.error('Erreur application prompt:', error);
                }
            };

            // Fonctions de gestion des interactions analytics
            const loadInteractionsData = async () => {
                try {
                    const params = new URLSearchParams({
                        limit: interactionsFilter.limit.toString()
                    });

                    if (interactionsFilter.session_id) {
                        params.append('session_id', interactionsFilter.session_id);
                    }

                    const response = await fetch(`http://localhost:8000/analytics/interactions?${params}`);
                    if (response.ok) {
                        const data = await response.json();
                        setInteractionsData(data.interactions || []);
                        console.log('[Interactions] Loaded', data.interactions.length, 'interactions');
                    }
                } catch (error) {
                    console.error('Erreur chargement interactions:', error);
                }
            };

            const loadInteractionsStats = async () => {
                try {
                    const response = await fetch('http://localhost:8000/analytics/stats');
                    if (response.ok) {
                        const data = await response.json();
                        setInteractionsStats(data);
                        console.log('[Interactions] Stats loaded');
                    }
                } catch (error) {
                    console.error('Erreur chargement stats:', error);
                }
            };

            // Fonctions de transformation des données pour ApexCharts
            const prepareTimelineData = () => {
                // Grouper interactions par jour - Format ApexCharts
                const byDay = {};
                interactionsData.forEach(interaction => {
                    const date = interaction.created_at ? interaction.created_at.split('T')[0] : 'unknown';
                    byDay[date] = (byDay[date] || 0) + 1;
                });
                const sorted = Object.entries(byDay).sort((a, b) => a[0].localeCompare(b[0]));
                return {
                    categories: sorted.map(([date]) => date),
                    data: sorted.map(([, count]) => count)
                };
            };

            const prepareNemetonEvolutionData = () => {
                // Évolution métriques Nemeton - Format ApexCharts
                const filtered = interactionsData.filter(i => i.nemeton_before && i.nemeton_after);
                return {
                    categories: filtered.map(i => new Date(i.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })),
                    series: [
                        {
                            name: 'Coherence',
                            data: filtered.map(i => parseFloat(i.nemeton_after.coherence?.toFixed(3) || 0))
                        },
                        {
                            name: 'Fit',
                            data: filtered.map(i => parseFloat(i.nemeton_after.fit?.toFixed(3) || 0))
                        }
                    ]
                };
            };

            const prepareLLMResponseTimeData = () => {
                // Temps de réponse LLM - Format ApexCharts
                const filtered = interactionsData.filter(i => i.execution_time > 0);
                return {
                    categories: filtered.map(i => new Date(i.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })),
                    data: filtered.map(i => parseFloat(i.execution_time?.toFixed(2) || 0))
                };
            };

            const prepareParamsRadarData = () => {
                // Distribution paramètres - Format ApexCharts
                if (interactionsData.length === 0) return { categories: [], data: [] };

                const sums = { rho: 0, tau_c: 0, delta_r: 0, kappa: 0 };
                let count = 0;

                interactionsData.forEach(i => {
                    if (i.params) {
                        sums.rho += i.params.rho || 0;
                        sums.tau_c += i.params.tau_c || 0;
                        sums.delta_r += i.params.delta_r || 0;
                        sums.kappa += i.params.kappa || 0;
                        count++;
                    }
                });

                if (count === 0) return { categories: [], data: [] };

                return {
                    categories: ['ρ', 'τ', 'δr', 'κ'],
                    data: [
                        parseFloat((sums.rho / count).toFixed(2)),
                        parseFloat((sums.tau_c / count).toFixed(2)),
                        parseFloat((sums.delta_r / count).toFixed(2)),
                        parseFloat((sums.kappa / count).toFixed(2))
                    ]
                };
            };

            const prepareACEBulletsData = () => {
                // Bullets ACE - Format ApexCharts
                return {
                    categories: ['Générés', 'Ingérés'],
                    data: [
                        interactionsStats?.ace?.total_bullets_generated || 0,
                        interactionsStats?.ace?.total_bullets_ingested || 0
                    ]
                };
            };

            const prepareGraphInjectionData = () => {
                // Graph injection - Format ApexCharts
                const total = interactionsStats?.global?.total_interactions || 0;
                const injected = interactionsStats?.graph?.injection_count || 0;
                return {
                    labels: ['Graph ON', 'Graph OFF'],
                    data: [injected, total - injected]
                };
            };

            // Fonctions de gestion des sessions
            const loadSessionsList = async () => {
                try {
                    const response = await fetch('http://localhost:8000/sessions/list');
                    if (response.ok) {
                        const data = await response.json();
                        setSessions(data.sessions || []);
                    }
                } catch (error) {
                    console.error('Erreur chargement sessions:', error);
                }
            };

            const saveCurrentSession = async (title = '') => {
                if (messages.length === 0) return;
                
                try {
                    const response = await fetch('http://localhost:8000/sessions/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            session_id: config.session_id,
                            messages: messages,
                            config: config,
                            session_stats: sessionStats,
                            title: title || `Session ${new Date().toLocaleString()}`
                        })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        setCurrentSessionPath(data.session_path);
                        loadSessionsList();
                        return data.session_path;
                    }
                } catch (error) {
                    console.error('Erreur sauvegarde session:', error);
                }
            };

            const loadSession = async (sessionPath) => {
                try {
                    const response = await fetch('http://localhost:8000/sessions/load', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_path: sessionPath })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const sessionData = data.data;

                        if (sessionData.messages) {
                            const processedMessages = sessionData.messages.map(msg => ({
                                ...msg,
                                timestamp: msg.timestamp ? new Date(msg.timestamp) : new Date()
                            }));
                            setMessages(processedMessages);
                        }

                        // CRITIQUE: Synchroniser le session_id avec la session chargée
                        if (sessionData.session_id) {
                            const newConfig = {
                                ...config,
                                ...sessionData.config,
                                session_id: sessionData.session_id  // Force le bon session_id
                            };
                            setConfig(newConfig);

                            // Synchroniser sessionStorage (pour support multi-onglets)
                            sessionStorage.setItem('lyra_session_id', sessionData.session_id);
                            sessionStorage.setItem('lyra_config', JSON.stringify(newConfig));

                            console.log('[SESSION] Session chargee:', sessionData.session_id);
                        } else if (sessionData.config) {
                            // Fallback si pas de session_id explicite
                            setConfig(prev => ({ ...prev, ...sessionData.config }));
                        }

                        if (sessionData.statistics || sessionData.metadata) {
                            const stats = sessionData.statistics || sessionData.metadata;
                            setSessionStats({
                                totalMessages: stats.message_count || stats.totalMessages || 0,
                                totalTokens: stats.total_tokens || stats.totalTokens || 0,
                                avgResponseTime: stats.avg_response_time || stats.avgResponseTime || 0,
                                graphInjections: stats.graphInjections || 0
                            });
                        }

                        setCurrentSessionPath(sessionPath);
                        setShowSessions(false);
                    }
                } catch (error) {
                    console.error('Erreur chargement session:', error);
                }
            };

            const deleteSession = async (sessionPath) => {
                if (!confirm('Supprimer cette session ?')) return;
                
                try {
                    const response = await fetch(`http://localhost:8000/sessions/${encodeURIComponent(sessionPath)}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        loadSessionsList();
                        if (currentSessionPath === sessionPath) {
                            setCurrentSessionPath(null);
                        }
                    }
                } catch (error) {
                    console.error('Erreur suppression session:', error);
                }
            };

            // Charger presets depuis API
            const loadPresetsFromAPI = async () => {
                try {
                    const response = await fetch('http://localhost:8000/api/presets');
                    const data = await response.json();

                    if (data.status === 'success' && data.presets && data.presets.length > 0) {
                        // Convertir presets API en format interface
                        const apiPresets = data.presets.map(p => ({
                            name: p.name,
                            icon: getPresetIcon(p.id),
                            config: {
                                rho: p.parameters.rho,
                                delta_r: p.parameters.delta_r,
                                tau_c: p.parameters.tau_c,
                                kappa: p.parameters.kappa
                            },
                            description: p.description,
                            id: p.id,
                            isDefault: p.id === 'optimal_gen8'
                        }));

                        setConfigPresets(apiPresets);
                        console.log('[Presets] Loaded from API:', apiPresets.length, 'presets');

                        // Appliquer preset par défaut
                        const defaultPreset = apiPresets.find(p => p.isDefault);
                        if (defaultPreset) {
                            console.log('[Presets] Applying default:', defaultPreset.name);
                            applyPreset(defaultPreset);
                        }
                    } else {
                        console.warn('[Presets] API returned no presets, using hardcoded');
                    }
                } catch (error) {
                    console.error('[Presets] Error loading from API:', error);
                    console.log('[Presets] Using hardcoded presets as fallback');
                }
            };

            // Fonction helper pour icônes presets
            const getPresetIcon = (presetId) => {
                const icons = {
                    'optimal_gen8': '🏆',
                    'focused_conservative': '🎯',
                    'creative_exploratory': '🎨',
                    'stable_safe': '🛡️',
                    'high_coherence': '🔬',
                    'low_latency': '⚡',
                    'research_deep': '🔍'
                };
                return icons[presetId] || '⚙️';
            };

            // Application des presets
            const applyPreset = (preset) => {
                setConfig(prev => ({ ...prev, ...preset.config }));
                if (preset.special === 'nemeton' || preset.id === 'optimal_gen8') {
                    setShowNemeton(true);
                }
            };

            // Processus interaction Nemeton (auto-ajustement)
            const processNemetonInteraction = async (userText, lyraResponse) => {
                try {
                    const response = await fetch('http://localhost:8000/nemeton/interaction', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_text: userText,
                            lyra_response: lyraResponse
                        })
                    });

                    if (!response.ok) {
                        console.error('[Nemeton] Interaction error:', response.status);
                        return;
                    }

                    const data = await response.json();
                    console.log('[Nemeton] Suggested params:', data);

                    // Stocker suggestions
                    setNemetonSuggestedParams({
                        rho: data.rho,
                        tau_c: data.tau_c,
                        delta_r: data.delta_r,
                        metrics: {
                            coherence: data.coherence,
                            fit: data.fit,
                            pressure: data.pressure,
                            tension: data.tension
                        }
                    });

                    // Vérifier convergence
                    if (data.converged && !nemetonConverged) {
                        setNemetonConverged(true);
                        showToast(`🎯 Nemeton convergé à l'étape ${data.convergence_step}!`, 'success');
                    }

                    // Auto-appliquer si activé
                    if (autoApplyNemeton) {
                        setConfig(prev => ({
                            ...prev,
                            rho: data.rho,
                            tau_c: data.tau_c,
                            delta_r: data.delta_r
                        }));
                        showToast('✨ Paramètres optimaux appliqués', 'info');
                    }
                } catch (error) {
                    console.error('[Nemeton] Process interaction error:', error);
                }
            };

            // Fonction toast notifications
            const showToast = (message, type = 'info') => {
                console.log(`[Toast ${type}]`, message);
                // TODO: Implémenter vraie notification toast visuelle
            };

            // Gestion de l'envoi de message
            const handleSendMessage = async () => {
                if (!inputText.trim()) return;
                
                setIsLoading(true);
                const startTime = Date.now();
                
                const userMessage = {
                    id: Date.now(),
                    role: 'user',
                    content: inputText,
                    timestamp: new Date(),
                    config: { ...config }
                };
                
                setMessages(prev => [...prev, userMessage]);
                setInputText('');
                
                try {
                    // Log pour debug
                    console.log('[DEBUG] Sending session_id:', config.session_id);

                    const response = await fetch('http://localhost:8000/lyra/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: inputText,
                            session_id: config.session_id,  // CRITIQUE: session_id pour mémoire
                            rho: config.rho,
                            delta_r: config.delta_r,
                            tau_c: config.tau_c,
                            kappa: config.kappa,
                            enable_graph_injection: config.enable_graph_injection,
                            cards: []
                        })
                    });

                    // Amélioration : extraire le message d'erreur détaillé du body
                    if (!response.ok) {
                        let errorDetail = `HTTP ${response.status}`;
                        try {
                            const errorData = await response.json();
                            if (errorData.detail) {
                                if (typeof errorData.detail === 'object') {
                                    errorDetail = errorData.detail.error || JSON.stringify(errorData.detail);
                                } else {
                                    errorDetail = errorData.detail;
                                }
                            }
                        } catch (e) {
                            // Si le body n'est pas JSON, utiliser le status code
                        }
                        throw new Error(errorDetail);
                    }

                    const data = await response.json();
                    const endTime = Date.now();
                    const responseTime = endTime - startTime;
                    
                    const lyraMessage = {
                        id: Date.now() + 1,
                        role: 'assistant',
                        content: data.text,
                        timestamp: new Date(),
                        metadata: {
                            model: data.model,
                            responseTime,
                            config: { ...config },
                            tokens: Math.ceil(data.text.length / 4)
                        }
                    };
                    
                    setMessages(prev => [...prev, lyraMessage]);

                    setSessionStats(prev => ({
                        totalMessages: prev.totalMessages + 1,
                        totalTokens: prev.totalTokens + lyraMessage.metadata.tokens,
                        avgResponseTime: Math.round((prev.avgResponseTime * prev.totalMessages + responseTime) / (prev.totalMessages + 1)),
                        graphInjections: prev.graphInjections + (config.enable_graph_injection ? 1 : 0)
                    }));

                    setLastMetrics(lyraMessage.metadata);

                    // Traiter interaction Nemeton pour auto-ajustement
                    if (autoApplyNemeton || nemetonSuggestedParams !== null) {
                        processNemetonInteraction(userMessage.content, data.text);
                    }

                } catch (error) {
                    console.error('Erreur:', error);

                    // Message d'erreur plus informatif
                    let errorContent = `⚠️ **Erreur de communication**\n\n`;
                    errorContent += `**Détails:** ${error.message}\n\n`;

                    // Suggestions selon le type d'erreur
                    if (error.message.includes('404')) {
                        errorContent += `**Cause probable:** Endpoint Ollama non disponible\n`;
                        errorContent += `**Solution:** Le serveur devrait maintenant utiliser /api/chat. Réessayez.`;
                    } else if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                        errorContent += `**Cause probable:** Serveur non accessible\n`;
                        errorContent += `**Solution:** Vérifiez que le serveur Lyra tourne sur http://localhost:8000`;
                    } else if (error.message.includes('Ollama')) {
                        errorContent += `**Cause probable:** Problème avec Ollama\n`;
                        errorContent += `**Solution:** Vérifiez qu'Ollama est démarré (ollama serve)`;
                    }

                    const errorMessage = {
                        id: Date.now() + 1,
                        role: 'assistant',
                        content: errorContent,
                        error: true,
                        timestamp: new Date()
                    };
                    setMessages(prev => [...prev, errorMessage]);
                }
                
                setIsLoading(false);
            };

            // Reset conversation - Nouvelle session
            const resetConversation = () => {
                const newSessionId = generateSessionId();

                // Mettre à jour localStorage
                localStorage.setItem('lyra_session_id', newSessionId);
                console.log('[RESET] Nouvelle conversation - session_id:', newSessionId);

                setMessages([]);
                setSessionStats({
                    totalMessages: 0,
                    totalTokens: 0,
                    avgResponseTime: 0,
                    graphInjections: 0
                });
                setConfig(prev => ({ ...prev, session_id: newSessionId }));
            };

            // Export conversation
            const exportConversation = () => {
                const data = {
                    timestamp: new Date().toISOString(),
                    config,
                    sessionStats,
                    messages: messages.map(m => ({
                        role: m.role,
                        content: m.content,
                        timestamp: m.timestamp,
                        metadata: m.metadata
                    }))
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `lyra_session_${Date.now()}.json`;
                a.click();
            };

            // Formatage des sessions
            const formatSessionDate = (isoString) => {
                try {
                    return new Date(isoString).toLocaleString('fr-FR', {
                        day: '2-digit',
                        month: '2-digit', 
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } catch {
                    return isoString;
                }
            };

            const getSessionPreview = (session) => {
                const title = session.title || `Session ${session.folder_name}`;
                const messageCount = session.message_count || 0;
                const tokens = session.total_tokens || 0;
                const avgTime = session.avg_response_time || 0;
                
                return {
                    title: title.length > 40 ? title.substring(0, 40) + '...' : title,
                    subtitle: `${messageCount} msg • ~${tokens} tokens • ${avgTime}ms moy`,
                    date: formatSessionDate(session.created_at),
                    path: session.folder_path
                };
            };

            // Helpers pour les métriques Nemeton
            const getMetricClass = (value, metric) => {
                if (metric === 'tension' || metric === 'pressure') {
                    if (value > 0.7) return 'high';
                    if (value > 0.4) return 'medium';
                    return 'low';
                }
                if (metric === 'coherence' || metric === 'fit') {
                    if (value > 0.7) return 'low';
                    if (value > 0.4) return 'medium';
                    return 'high';
                }
                return 'medium';
            };

            // Composant pour les paramètres
            const ParameterControl = ({ label, value, min, max, step, onChange, color = "blue" }) => {
                // Fonction pour incrémenter la valeur
                const increment = () => {
                    const newValue = Math.min(max, value + step);
                    onChange(parseFloat(newValue.toFixed(2)));
                };

                // Fonction pour décrémenter la valeur
                const decrement = () => {
                    const newValue = Math.max(min, value - step);
                    onChange(parseFloat(newValue.toFixed(2)));
                };

                // Fonction pour gérer la saisie directe
                const handleInputChange = (e) => {
                    const inputValue = e.target.value;
                    if (inputValue === '' || inputValue === '-') return; // Permettre entrée vide ou signe négatif

                    const newValue = parseFloat(inputValue);
                    if (!isNaN(newValue)) {
                        // Clamp entre min et max
                        const clampedValue = Math.max(min, Math.min(max, newValue));
                        onChange(parseFloat(clampedValue.toFixed(2)));
                    }
                };

                return (
                    <div className="parameter-knob bg-slate-800 rounded-lg p-3">
                        <div className="flex justify-between items-center mb-2">
                            <label className="text-sm font-medium text-slate-300">{label}</label>

                            {/* Contrôle numérique avec boutons fléchés */}
                            <div className="flex items-center space-x-1">
                                <button
                                    onClick={decrement}
                                    className={`parameter-arrow-btn bg-${color}-700 hover:bg-${color}-600 text-white rounded transition-colors`}
                                    title="Décrémenter"
                                >
                                    ▼
                                </button>
                                <input
                                    type="number"
                                    value={value.toFixed(2)}
                                    onChange={handleInputChange}
                                    min={min}
                                    max={max}
                                    step={step}
                                    className={`parameter-number-input w-16 text-center text-sm font-mono bg-slate-700 border border-${color}-600 text-white rounded px-1 py-1 focus:outline-none`}
                                />
                                <button
                                    onClick={increment}
                                    className={`parameter-arrow-btn bg-${color}-700 hover:bg-${color}-600 text-white rounded transition-colors`}
                                    title="Incrémenter"
                                >
                                    ▲
                                </button>
                            </div>
                        </div>
                        <input
                            type="range"
                            min={min}
                            max={max}
                            step={step}
                            value={value}
                            onChange={(e) => onChange(parseFloat(e.target.value))}
                            className={`w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer slider-${color}`}
                        />
                        <div className="flex justify-between text-xs text-slate-500 mt-1">
                            <span>{min}</span>
                            <span>{max}</span>
                        </div>
                    </div>
                );
            };

            // Calcul dynamique de la marge gauche selon les panneaux visibles
            const calculateLeftMargin = () => {
                let margin = 0;
                if (showNemeton) margin += 384; // w-96 = 384px
                if (showACE) margin += 384;
                if (showInteractions) margin += 500; // w-[500px] pour dashboard
                if (showPromptManager) margin += 384;
                if (showSessions) margin += 320; // w-80 = 320px
                if (showSettings) margin += 320;
                return margin;
            };

            const leftMargin = calculateLeftMargin();

            // Calcul de la largeur de la barre de saisie
            const inputBarLeft = leftMargin;

            // useEffect pour gérer les charts ApexCharts
            useEffect(() => {
                if (!window.ApexCharts || !showInteractions) return;

                const charts = [];

                // Thème dark Slate commun à tous les charts
                const darkTheme = {
                    theme: { mode: 'dark' },
                    chart: {
                        background: 'transparent',
                        foreColor: '#94a3b8',
                        toolbar: { show: false }
                    },
                    grid: { borderColor: '#475569' },
                    tooltip: {
                        theme: 'dark',
                        style: {
                            fontSize: '12px',
                            background: '#1e293b'
                        }
                    }
                };

                // Timeline Charts
                if (interactionsTab === 'timeline') {
                    // 1. LineChart - Interactions par jour
                    const timelineData = prepareTimelineData();
                    const el1 = document.querySelector('#chart-timeline-interactions');
                    if (el1 && timelineData.data.length > 0) {
                        const chart1 = new ApexCharts(el1, {
                            ...darkTheme,
                            series: [{ name: 'Interactions', data: timelineData.data }],
                            chart: { ...darkTheme.chart, type: 'line', height: 200 },
                            xaxis: { categories: timelineData.categories },
                            stroke: { curve: 'smooth', width: 2 },
                            colors: ['#3b82f6']
                        });
                        chart1.render();
                        charts.push(chart1);
                    }

                    // 2. AreaChart - Métriques Nemeton
                    const nemetonData = prepareNemetonEvolutionData();
                    const el2 = document.querySelector('#chart-timeline-nemeton');
                    if (el2 && nemetonData.series[0].data.length > 0) {
                        const chart2 = new ApexCharts(el2, {
                            ...darkTheme,
                            series: nemetonData.series,
                            chart: { ...darkTheme.chart, type: 'area', height: 250 },
                            xaxis: { categories: nemetonData.categories },
                            stroke: { curve: 'smooth', width: 2 },
                            colors: ['#10b981', '#6366f1'],
                            fill: { opacity: 0.3 },
                            yaxis: { min: 0, max: 1 }
                        });
                        chart2.render();
                        charts.push(chart2);
                    }

                    // 3. LineChart - Temps réponse LLM
                    const llmData = prepareLLMResponseTimeData();
                    const el3 = document.querySelector('#chart-timeline-llm');
                    if (el3 && llmData.data.length > 0) {
                        const chart3 = new ApexCharts(el3, {
                            ...darkTheme,
                            series: [{ name: 'Temps (s)', data: llmData.data }],
                            chart: { ...darkTheme.chart, type: 'line', height: 200 },
                            xaxis: { categories: llmData.categories },
                            stroke: { curve: 'smooth', width: 2 },
                            colors: ['#f59e0b']
                        });
                        chart3.render();
                        charts.push(chart3);
                    }
                }

                // Métriques Charts
                if (interactionsTab === 'metrics') {
                    // 1. RadarChart - Distribution paramètres
                    const paramsData = prepareParamsRadarData();
                    const el4 = document.querySelector('#chart-metrics-params');
                    if (el4 && paramsData.data.length > 0) {
                        const chart4 = new ApexCharts(el4, {
                            ...darkTheme,
                            series: [{ name: 'Valeur Moyenne', data: paramsData.data }],
