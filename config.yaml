# ============================================================================
# EPP_VERDICT — CONFIGURATION
# ============================================================================
# Epistemic Proof Program — Oracle de consensus multi-LLM sur Solana
#
# Seules les clés effectivement lues par le code ou validées par les tests
# sont présentes. Les sections "providers", "server", "logging" ont été
# purgées (Phase 4.4.1) : valeurs hardcodées ou lues via env vars.
# ============================================================================

# ============================================================================
# DATABASE
# ============================================================================
database:
  path: "data/epp_devnet.db"

# ============================================================================
# ESMM (Exploration Sémantique Multi-Modèles)
# ============================================================================
esmm:
  default_models: 3                    # Nombre de modèles par run
  models:
  - "mistral:latest"
  - "llama3.1:8b"
  - "gemma3:latest"
  min_consensus: 0.4                   # Seuil min de consensus (orchestrator.py)
  cycle_sequence:                      # Séquence des types de cycles ESMM
    - "divergent"
    - "debate"
    - "meta"
  use_legacy_relation_groups: true  # true = legacy behavior, false = relation_vocabulary.py
  # ADR-011-v2: Semantic Fingerprinting (reconciliation lexicale)
  fingerprint:
    enabled: true
    max_neighbors: 5                   # Voisins demandés par terme
    min_neighbors: 3                   # Minimum pour fingerprint valide
    merge_threshold: 0.6               # Recouvrement pondéré pour fusion
    subnode_threshold: 0.3             # Recouvrement pour sous-nœud
    matching_algorithm: "jaro_winkler"
    timeout_seconds: 60
    min_unique_terms: 5                # Sous ce seuil, fingerprinting sauté
    inject_micro_graphs: false         # Désactivé Phase 1

# ============================================================================
# CONFIDENCE TIERS (Méthode scientifique)
# ============================================================================
confidence:
  thresholds:
    sandbox: 0.0                       # [0.0, 0.4)
    proposition: 0.4                   # [0.4, 0.7) + ≥2 modèles
    validated: 0.7                     # [0.7, 0.85) + ≥3 modèles + ≥2 familles archi
    verified: 0.85                     # [0.85, 1.0] + source_anchor OU validation_count ≥ 3

# ============================================================================
# MODEL TRACK RECORD
# ============================================================================
track_record:
  brier_score_window_days: 90          # Fenêtre glissante pour le Brier score

# ============================================================================
# EMBEDDINGS
# ============================================================================
embeddings:
  active_model: "mxbai-embed-large"
  fallback_reembed: false
  similarity_min_score: 0.1

# ============================================================================
# SOLANA (devnet uniquement)
# ============================================================================
solana:
  cluster: "devnet"                    # "devnet" ou "localnet" — JAMAIS mainnet

# ============================================================================
# RWA — Sources autoritaires externes (ADR-012)
# Credentials via env vars UNIQUEMENT — jamais en clair dans ce fichier.
# ============================================================================
sources:
  adapters:
    opensanctions:
      enabled: true
      ttl_hours: 24
      # OPENSANCTIONS_ENDPOINT env var (défaut: http://localhost:8080)
    ofac_sdn:
      enabled: false
      ttl_hours: 24
      # OFAC_API_KEY env var (requis si enabled: true)
      # OFAC_ENDPOINT env var (optionnel, défaut API publique)
    eu_cfsp:
      enabled: false
      ttl_hours: 24
      # EU_CFSP_ENDPOINT env var (optionnel, défaut sanctions.io)
    verra_vcs:
      enabled: false
      ttl_hours: 24
      # Pas de credentials — API publique Verra Registry

# ============================================================================
# CACHE ÉPISTÉMIQUE (ADR-013)
# ============================================================================
cache:
  enabled: true
  ttl_hours: 168          # 7 jours — re-délibération si attestation plus ancienne
  min_tier_for_cache: "proposition"  # En dessous de ce tier : toujours re-délibérer

# ============================================================================
# AUDIT SMART CONTRACTS (ADR-014)
# ============================================================================
audit:
  enabled: true
  db_path: "data/epp_audit_devnet.db"
  slice_strategy: "function_level_v1"
  severity_taxonomy: "tob_4level"
  slither_path: "slither"

# ============================================================================
# GÉOPOLITIQUE — Oracle ACLED (ADR-016)
# Credentials via env vars UNIQUEMENT.
# ============================================================================
geopolitical:
  acled_email_env: "ACLED_EMAIL"
  acled_password_env: "ACLED_PASSWORD"
  default_limit: 500

# ============================================================================
# FLYWHEEL ÉPISTÉMIQUE (ADR-018)
# Inject les ancres déterministes dans le contexte des LLMs (VERIFY mode only)
# ============================================================================
flywheel:
  enabled: true
