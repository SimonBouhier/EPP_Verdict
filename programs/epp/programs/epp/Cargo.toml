[package]
name = "epp"
version = "0.1.0"
description = "Epistemic Proof Program - On-chain attestations from multi-LLM consensus"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "epp"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
